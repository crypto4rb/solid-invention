[project]
name = "ai_architect"
version = "0.1.0"
description = "ai-architect using crewAI"
authors = [{ name = "Divakar Singh", email = "ds299555@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai==1.14.5",
    "fastapi>=0.136.3",
    "langchain>=1.3.1",
    "langfuse>=4.7.0",
    "langsmith>=0.8.5",
    "openinference-instrumentation-crewai>=1.1.8",
    "streamlit>=1.57.0",
    "uvicorn>=0.48.0",
]

[project.scripts]
ai_architect = "ai_architect.main:run"
run_crew = "ai_architect.main:run"
train = "ai_architect.main:train"
replay = "ai_architect.main:replay"
test = "ai_architect.main:test"
run_with_trigger = "ai_architect.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
